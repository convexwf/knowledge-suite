services:
  knowledge-ingest-server:
    build:
      context: .
      dockerfile: apps/knowledge-ingest-server/Dockerfile
      target: runtime
    image: knowledge-ingest-server:local
    container_name: knowledge-ingest-server
    restart: unless-stopped
    environment:
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: 18765
      KNOWLEDGE_TOKEN: ${KNOWLEDGE_TOKEN:-dev-token}
      KNOWLEDGE_STORE: /data
      KNOWLEDGE_FETCH_TIMEOUT_MS: ${KNOWLEDGE_FETCH_TIMEOUT_MS:-15000}
      KNOWLEDGE_MAX_HTML_BYTES: ${KNOWLEDGE_MAX_HTML_BYTES:-10485760}
      KNOWLEDGE_GITHUB_TOKEN: ${KNOWLEDGE_GITHUB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      KNOWLEDGE_MAX_GITHUB_FILES: ${KNOWLEDGE_MAX_GITHUB_FILES:-100}
      KNOWLEDGE_MAX_GITHUB_MARKDOWN_BYTES: ${KNOWLEDGE_MAX_GITHUB_MARKDOWN_BYTES:-5242880}
      KNOWLEDGE_MAX_GITHUB_ASSET_REFERENCES: ${KNOWLEDGE_MAX_GITHUB_ASSET_REFERENCES:-500}
      KNOWLEDGE_MAX_GITHUB_ASSET_BYTES: ${KNOWLEDGE_MAX_GITHUB_ASSET_BYTES:-20971520}
      KNOWLEDGE_AI_ENABLED: "true"
      KNOWLEDGE_AI_PROVIDER: ollama
      KNOWLEDGE_AI_OLLAMA_BASE_URL: ${KNOWLEDGE_AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      KNOWLEDGE_AI_OLLAMA_MODEL: ${KNOWLEDGE_AI_OLLAMA_MODEL:-qwen2.5:7b}
      KNOWLEDGE_AI_OLLAMA_TIMEOUT_MS: ${KNOWLEDGE_AI_OLLAMA_TIMEOUT_MS:-120000}
    ports:
      - "127.0.0.1:18765:18765"
    volumes:
      - ${KNOWLEDGE_STORE_HOST:-./knowledge-store}:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18765/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
